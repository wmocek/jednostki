<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zamiana jednostek – zadanie domowe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fbfcfe; --grid: #dde7f2; --ink: #1c2230; --muted: #5b6475;
    --pen: #1f47b8; --ok: #1d7a3a; --ok-bg: #e3f5e8; --bad: #c0262d; --bad-bg: #fde6e7;
    --panel: #ffffff; --line: #9aa6b8; --box: #ffffff; --box-border: #4a5a78;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #151a24; --grid: #222a38; --ink: #e6e9ef; --muted: #a3acbb;
      --pen: #8fb0ff; --ok: #5fd08a; --ok-bg: #1b3a26; --bad: #ff7b7f;
      --bad-bg: #452023; --panel: #1b2130; --line: #5b6679; --box: #10141d; --box-border: #8b98b3;
    }
  }
  :root[data-theme="dark"] {
    --paper: #151a24; --grid: #222a38; --ink: #e6e9ef; --muted: #a3acbb;
    --pen: #8fb0ff; --ok: #5fd08a; --ok-bg: #1b3a26; --bad: #ff7b7f;
    --bad-bg: #452023; --panel: #1b2130; --line: #5b6679; --box: #10141d; --box-border: #8b98b3;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; color: var(--ink); background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
    font-size: 1.125rem; line-height: 1.6;
  }
  main { max-width: 60rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  header h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 .5rem; }
  header p { margin: 0 0 2rem; color: var(--muted); max-width: 42rem; }

  section.task {
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 1.5rem 1.5rem 1.25rem; margin-bottom: 1.75rem;
  }
  .task-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
  section.task h2 { font-size: 1.25rem; margin: 0; }
  .counter { font-weight: 600; color: var(--muted); font-size: 1rem; }
  .counter.full { color: var(--ok); }
  section.task .cmd { margin: .25rem 0 1rem; color: var(--muted); }

  .rows {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(4, auto);
    grid-auto-flow: column;
    gap: .6rem 3rem;
  }
  @media (max-width: 520px) {
    input.blank { width: 5rem; font-size: 1.3rem; }
    section.task { padding: 1.25rem 1rem 1rem; }
  }
  @media (max-width: 880px) {
    .rows { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-flow: row; }
  }
  .row { padding: .2rem 0 .2rem 1.9rem; text-indent: -1.9rem; line-height: 2.9rem; }
  .row .lbl { display: inline-block; width: 1.9rem; text-indent: 0; color: var(--muted); }

  .slot { position: relative; display: inline-block; margin: 0 .3rem; text-indent: 0; vertical-align: middle; line-height: 1; }
  input.blank {
    font-family: "Caveat", "Comic Sans MS", cursive;
    font-size: 1.6rem; font-weight: 700; color: var(--pen);
    width: 6rem; height: 2.3rem; text-align: center;
    border: 2px solid var(--box-border); border-radius: 6px;
    background: var(--box); padding: 0 .3rem; line-height: 1;
  }
  input.blank:focus { outline: 3px solid var(--pen); outline-offset: 2px; }
  input.blank.ok { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
  input.blank.bad { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
  .mark {
    position: absolute; top: -.55rem; right: -.55rem;
    width: 1.35rem; height: 1.35rem; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
    font-family: system-ui, sans-serif; font-size: .85rem; font-weight: 700; color: #fff;
    pointer-events: none;
  }
  .mark.ok { display: flex; background: var(--ok); }
  .mark.bad { display: flex; background: var(--bad); }

  details { margin-top: 1.25rem; color: var(--muted); font-size: 1rem; }
  summary { cursor: pointer; }
  details ul { margin: .5rem 0 0; padding-left: 1.25rem; }

  .total {
    border-top: 2px solid var(--ink); padding-top: 1.25rem;
    display: flex; flex-wrap: wrap; align-items: center; gap: 1rem 1.5rem;
  }
  .total .score { font-family: "Caveat", "Comic Sans MS", cursive; font-size: 2.6rem; color: var(--pen); line-height: 1; }
  button {
    font: inherit; font-size: 1rem; font-weight: 600; padding: .5rem 1.1rem; border-radius: 4px;
    border: 2px solid var(--pen); background: transparent; color: var(--pen); cursor: pointer;
  }
  button.primary { background: var(--pen); color: var(--panel); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .status { color: var(--muted); font-size: 1rem; margin: .75rem 0 0; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Zamiana jednostek</h1>
    <p>Wpisz liczby w okienka. Liczby dziesiętne możesz pisać z przecinkiem (0,5) albo z kropką (0.5). Gdy wypełnisz wszystkie okienka, na dole strony kliknij „Sprawdź odpowiedzi”: dobre odpowiedzi dostaną zielony ptaszek ✓, a złe czerwony krzyżyk ✗.</p>
  </header>

  <div id="tasks"></div>

  <div class="total">
    <button type="button" id="check" class="primary" disabled>Sprawdź odpowiedzi</button>
    <button type="button" id="reset">Wyczyść odpowiedzi</button>
    <span class="score" id="score" aria-live="polite"></span>
  </div>
  <p class="status" id="status" aria-live="polite"></p>
</main>

<script>
  // Liczby w nawiasach kwadratowych to poprawne odpowiedzi (okienka do wpisania).
  var TASKS = [
    {
      title: "Zadanie 1.",
      rows: [
        "6,4 kg = [640] dag = [6400] g",
        "[0.57] kg = 57 dag = [570] g",
        "[0.32] kg = [32] dag = 320 g",
        "2,7 t = [2700] kg = [270000] dag",
        "3,05 kg = [305] dag = [3050] g",
        "[0.45] t = 450 kg = [45000] dag",
        "12 dag = [120] g = [0.12] kg",
        "[0.075] kg = [7.5] dag = 75 g"
      ],
      hints: ["1 t = 1000 kg", "1 kg = 100 dag", "1 dag = 10 g"]
    },
    {
      title: "Zadanie 2.",
      rows: [
        "7 dm² = [700] cm²",
        "4600 cm² = [0.46] m²",
        "2,8 ha = [280] a",
        "[0.09] ha = 9 a = [900] m²",
        "3,5 m² = [350] dm²",
        "80 cm² = [0.8] dm²",
        "1,2 a = [120] m²",
        "6 m² = [60000] cm²"
      ],
      hints: ["1 dm² = 100 cm²", "1 m² = 100 dm² = 10 000 cm²", "1 a = 100 m²", "1 ha = 100 a"]
    },
    {
      title: "Zadanie 3.",
      rows: [
        "0,6 dm³ = [0.6] l",
        "85 cm³ = [0.085] l",
        "3 l = [3000] cm³",
        "24 ml = [24000] mm³",
        "2,5 l = [2500] ml",
        "750 ml = [0.75] dm³",
        "4000 mm³ = [4] cm³",
        "1,8 dm³ = [1800] cm³"
      ],
      hints: ["1 dm³ = 1 l", "1 l = 1000 ml = 1000 cm³", "1 ml = 1 cm³", "1 cm³ = 1000 mm³"]
    }
  ];

  var LETTERS = "abcdefghijkl";

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function render() {
    var root = document.getElementById("tasks");
    TASKS.forEach(function (t, ti) {
      var sec = document.createElement("section");
      sec.className = "task";
      var rowsHtml = t.rows.map(function (r, ri) {
        var n = 0;
        var parts = r.split(/(\[[^\]]+\])/).map(function (p) {
          var m = p.match(/^\[([^\]]+)\]$/);
          if (!m) return escapeHtml(p);
          n++;
          var label = "Zadanie " + (ti + 1) + LETTERS[ri] + ", okienko " + n;
          return '<span class="slot"><input class="blank" data-answer="' + m[1] +
                 '" inputmode="decimal" autocomplete="off" aria-label="' + label +
                 '"><span class="mark" aria-live="polite"></span></span>';
        }).join("");
        return '<div class="row"><span class="lbl">' + LETTERS[ri] + ')</span>' + parts + '</div>';
      }).join("");
      sec.innerHTML =
        '<div class="task-head"><h2>' + t.title + '</h2><span class="counter"></span></div>' +
        '<p class="cmd">Uzupełnij:</p>' +
        '<div class="rows">' + rowsHtml + '</div>' +
        '<details><summary>Przypomnij sobie zależności</summary><ul>' +
        t.hints.map(function (h) { return "<li>" + h + "</li>"; }).join("") +
        '</ul></details>';
      root.appendChild(sec);
    });
  }

  function parseAnswer(raw) {
    var s = String(raw).trim().replace(/\s+/g, "").replace(",", ".");
    if (!/^-?(\d+(\.\d*)?|\.\d+)$/.test(s)) return null;
    return parseFloat(s);
  }
  function same(a, b) { return Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(b)); }

  function clearMark(input) {
    var mark = input.nextElementSibling;
    input.classList.remove("ok", "bad");
    mark.className = "mark";
    mark.textContent = "";
    mark.removeAttribute("aria-label");
  }

  function check(input) {
    clearMark(input);
    var mark = input.nextElementSibling;
    var val = parseAnswer(input.value);
    var good = val !== null && same(val, parseFloat(input.dataset.answer));
    input.classList.add(good ? "ok" : "bad");
    mark.classList.add(good ? "ok" : "bad");
    mark.textContent = good ? "✓" : "✗";
    mark.setAttribute("aria-label", good ? "dobrze" : "źle");
    return good;
  }

  var inputs = document.querySelectorAll("input.blank");
  var checkBtn = document.getElementById("check");
  var scoreEl = document.getElementById("score");
  var statusEl = document.getElementById("status");

  function updateFilled() {
    var filled = 0;
    inputs.forEach(function (i) { if (i.value.trim() !== "") filled++; });
    var left = inputs.length - filled;
    checkBtn.disabled = left > 0;
    statusEl.textContent = left > 0
      ? "Wypełniono " + filled + " z " + inputs.length + " okienek. Zostało jeszcze " + left + "."
      : "Wszystkie okienka są wypełnione. Możesz sprawdzić odpowiedzi.";
  }

  function checkAll() {
    var total = 0;
    document.querySelectorAll("section.task").forEach(function (sec) {
      var list = sec.querySelectorAll("input.blank");
      var good = 0;
      list.forEach(function (i) { if (check(i)) good++; });
      var c = sec.querySelector(".counter");
      c.textContent = good + " / " + list.length + " pkt";
      c.classList.toggle("full", good === list.length);
      total += good;
    });
    scoreEl.textContent = total + " / " + inputs.length + " pkt";
    statusEl.textContent = total === inputs.length
      ? "Wszystko dobrze. Brawo!"
      : "Popraw odpowiedzi z czerwonym krzyżykiem i kliknij „Sprawdź odpowiedzi” jeszcze raz.";
    var firstBad = document.querySelector("input.blank.bad");
    if (firstBad) firstBad.focus({ preventScroll: false });
  }

  render();
  inputs = document.querySelectorAll("input.blank");
  inputs.forEach(function (i) {
    i.addEventListener("input", function () {
      clearMark(i);
      scoreEl.textContent = "";
      document.querySelectorAll(".counter").forEach(function (c) { c.textContent = ""; c.classList.remove("full"); });
      updateFilled();
    });
    i.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !checkBtn.disabled) checkAll();
    });
  });
  checkBtn.addEventListener("click", checkAll);
  document.getElementById("reset").addEventListener("click", function () {
    inputs.forEach(function (i) { i.value = ""; clearMark(i); });
    scoreEl.textContent = "";
    document.querySelectorAll(".counter").forEach(function (c) { c.textContent = ""; c.classList.remove("full"); });
    updateFilled();
  });
  updateFilled();
</script>
</body>
</html>
